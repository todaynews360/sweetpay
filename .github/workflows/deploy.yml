name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SweetPay
        run: pnpm --filter @workspace/sweetpay run build
        env:
          PORT: "3000"
          BASE_PATH: "/sweetpay/"
          NODE_ENV: production

      - name: Add .nojekyll
        run: touch artifacts/sweetpay/dist/public/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: artifacts/sweetpay/dist/public
          branch: gh-pages
          clean: true
